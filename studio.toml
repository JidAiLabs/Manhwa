[sources.asura]
base_url = "https://asurascans.com"
[sources.webtoon]
base_url = "https://www.webtoons.com"
[sources.elftoon]
base_url = "https://elftoon.com"

[detect]
backend = "yolo"
# v3 8-class (2026-07-15, run v3_8class_960 best=epoch 58): panel/speech_bubble/radio/
# speech_background/sfx_text/system_ui/caption_box/free_text. imgsz + class ids resolve
# from the ckpt itself. Rollback = point back at webtoon_panels.pt (legacy 6-class).
yolo_weights = "assets/models/webtoon_panels_v3.pt"

[gallerydl]
sleep = 2.0

[models]
# LLM models per stage (cost-tunable). Swap to cheaper tiers freely; the
# usage_cost logger reports exact tokens + $ per run so quality/cost is A/B-able.
# beats: the writer. CONFIRMED 2026-06-12: local Gemma 4 via Ollama ($0,
# ~55s/group on MPS; A/B'd vs Flash — 0 parse errors, 79% selection agreement).
# Flash remains one config flip away: backend="vertex", model="gemini-2.5-flash".
beats_backend = "ollama"
beats_model = "gemma4:26b"
# script: OpenAI. gpt-4.1-mini is API-deprecating 2026-10-14; gpt-5-nano is ~5x cheaper.
script_model = "gpt-5-nano"
# punchup: genre-aware persona pass over the grounded beats (channel voice).
# "cinematic" = alternate-by-beat: DRAMATIC beats (high scene intensity) keep the
#   cinematic atmosphere, CONNECTIVE beats get full persona — the user's blend.
# "full" | "light" | "off". Grounded line survives as narration_plain;
# caption-bearing groups reject rewrites that drop the caption words.
punchup = "cinematic"
# OCR/visioned stage: "apple" = on-device macOS Vision (FREE, 97%% F1 vs Google) | "google" (paid)
vision_backend = "apple"
# QA-eyes -> auto-heal (opt-in): a grounding judge flags weak/mis-grounded lines, the heal loop
# regenerates them, and the strictly-better safeguard reverts any non-improvement. false = current
# pipeline unchanged. Env STUDIO_SEMANTIC_HEAL=1 toggles per-run (used for the A/B comparison).
semantic_heal = true

[tts]
# voiced backend: "qwen-mlx" (Apple MLX, 8-bit Base clone — PRODUCTION 2026-06-22:
#   ~2x faster than torch-MPS, user-approved @ exag 1.4, runs in .mlx_venv) |
# "qwen" (torch MPS clone — prior production, kept as fallback) |
# "kokoro" (local, free, flatter) | "chatterbox" (local, MIT) | "elevenlabs" (cloud, paid).
# qwen-mlx expressiveness dial: STUDIO_MLX_EXAG (default 1.4) + STUDIO_MLX_TEMP.
# Modal RETIRED (2026-06-11): no external dependencies (user directive).
backend = "qwen-mlx"
voice_ref = "assets/voice/narrator_ref.wav"   # LOCKED narrator (user-picked clip g0021_p02).
                 # qwen-mlx/qwen clone it (Base ckpt + .txt transcript sidecar); chatterbox clones it too;
                 # kokoro ignores it (uses kokoro_voice).
python = ".mlx_venv/bin/python"   # repo-relative -> resolves per host (Air/Mini); MLX venv (mlx-audio). qwen fallback = .qwen_venv
kokoro_voice = "am_puck"   # used only when backend = "kokoro"
speed = 1.05   # delivery tempo (ffmpeg atempo, pitch-preserved) — 1.05 = 5% snappier; transcript UNCHANGED

[render]
# long_hold QA cap: one file shown continuously past this many seconds while
# STANDING IN for another beat's art (a swapped/held panel, e.g. the 24s
# canonicalized eye) BLOCKS the chapter. A genuine own-panel hold is
# content-driven pacing and stays legal at any length.
max_same_image_hold_sec = 10.0
# Shown-frame policy for story panels (render_prep --bubble-shown-mode):
#   keep     — bubbles ship as drawn; bubble-dominated EDGE bands trimmed (owner 2026-07-16)
#   art_only — frame = the detector's ART box: gutter/edge dialogue framed out on all
#              sides (narration carries it), nameplate captions + system windows stay,
#              art never cut (per-side keep fallback). NEEDS the v4 art-only weights
#              (assets/models/webtoon_panels_v4.pt) + a re-detect (`reset --to detected`);
#              on pre-v4 detections it silently behaves like keep. Owner 2026-07-23 goal.
bubble_shown_mode = "keep"

[teaser]
# bundle-level arc teaser: pick a high-stakes window from a bundle's chapters,
# render a short teaser.mp4, and prepend it to the bundle concat.
enabled = true
shortlist_n = 4
min_panels = 4
max_hook_panels = 10
max_hook_scan_chapters = 12   # cost guard only
max_seconds = 90              # cost guard only
payoff_tail_frac = 0.20       # spoiler guard: never pull from the last 20%
model = "gemini-2.5-flash"    # beats backend model (Vertex/ollama), not OpenAI

[publish]
# Once this many chapters of a series are PREPARED (beats on disk), the worker
# auto-PROPOSES the channel thumbnail + a debut-arc intro teaser for review in
# the dashboard. Both are proposals (you still approve them), and NEITHER
# blocks chapter processing — thumbnail runs on the api lane, the teaser on the
# cpu lane, while chapters keep preparing on the gpu lane. 0 = off (manual
# "generate thumbnail" / "Plan teaser" buttons only).
auto_after_chapters = 12
